# /etc/mosquitto/conf.d/bridge.conf  (Mosquitto instalado de forma nativa en Ubuntu Server)
listener 1883
allow_anonymous true

# Puente hacia el broker público para que la simulación de Wokwi llegue al servidor
connection bridge-wokwi
address broker.hivemq.com:1883
topic udb-aco941/lv220238/casa/# both 1
cleansession true
try_private false
remote_clientid aco941-rm-vm-01
notifications false
