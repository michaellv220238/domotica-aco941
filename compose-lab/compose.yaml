name: domotica-lab
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Define PG_PASSWORD en .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ../servidor/base_datos.sql:/project/base_datos.sql:ro
      - ./init-db.sh:/docker-entrypoint-initdb.d/01-domotica.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "domotica"]
      interval: 5s
      timeout: 3s
      retries: 12

  nodered:
    image: nodered/node-red:4.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1880:1880"
    volumes:
      - ./data/nodered:/data
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
